plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
    archivesName = 'sneak_through_berries'
}

dependencies {
    // Before 26.x the game is obfuscated: Loom translates from Mojang's official names, the same as in the 26.x code
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
}

processResources {
    def props = [version: project.version, minecraft_version: minecraft_version, loader_version: loader_version]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from(["LICENSE.md", "COPYING"]) {
        rename { "${it}_sneak_through_berries" }
    }
}
